name: Build and Beta

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Configure GCC Release
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DBUILD_TESTING=OFF
      - name: Configure MSVC Release
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Package Linux
        if: runner.os == 'Linux'
        run: bash packaging/linux.sh
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call packaging\windows.bat
      - name: Smoke-test packaged rules and create ZIP
        run: python cmake/ci_smoke.py release/${{ matrix.platform }} --archive dist/cxapkid_${{ matrix.platform }}_x64.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cxapkid_${{ matrix.platform }}_x64
          path: dist/cxapkid_${{ matrix.platform }}_x64.zip
          if-no-files-found: error

  beta:
    name: Update Beta prerelease
    needs: build
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: cxapkid-beta
      cancel-in-progress: false
    steps:
      - name: Check current master
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale build $GITHUB_SHA; master is now $current." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v8.0.2
        if: steps.current.outputs.publish == 'true'
        with:
          pattern: cxapkid_*_x64
          merge-multiple: true
          path: artifacts
      - name: Publish current master build
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "Skipping stale build $GITHUB_SHA; master is now $current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -f artifacts/cxapkid_linux_x64.zip
          test -f artifacts/cxapkid_windows_x64.zip

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/Beta" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/Beta" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/Beta -f sha="$GITHUB_SHA"
          fi
          cat > beta-notes.md <<EOF
          Automated Beta packages from commit [$GITHUB_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA).

          [Build and package smoke tests]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).
          EOF
          if gh release view Beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit Beta --repo "$GITHUB_REPOSITORY" --title Beta --prerelease --latest=false --notes-file beta-notes.md
          else
            gh release create Beta --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title Beta --prerelease --latest=false --notes-file beta-notes.md
          fi
          gh release upload Beta artifacts/cxapkid_linux_x64.zip artifacts/cxapkid_windows_x64.zip --repo "$GITHUB_REPOSITORY" --clobber
